server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api requests to the backend container.
    # This avoids CORS entirely — browser talks only to this Nginx.
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        proxy_read_timeout   120s;  # AI compliance checks can take 30–45 s
    }

    # React SPA — let React Router handle all client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
